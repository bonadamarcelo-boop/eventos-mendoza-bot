name: Buscar Vacantes Laborales

on:
  schedule:
    - cron: '0 13 * * 1,3,5'   # Lunes, miércoles y viernes a las 10am Argentina
  workflow_dispatch:             # También permite correrlo manual desde Actions

jobs:
  buscar-vacantes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar bot de vacantes
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER:       ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:   ${{ secrets.GMAIL_PASSWORD }}
          SERPAPI_KEY:      ${{ secrets.SERPAPI_KEY }}
        run: python vacantes_mendoza.py

      - name: Guardar vacantes vistas
        uses: actions/upload-artifact@v4
        with:
          name: vacantes-vistas
          path: vacantes_vistas.json
          if-no-files-found: ignore
          
